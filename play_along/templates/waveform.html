<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>

<head>
  <meta charset="utf-8" />
  <title>{{ track_data.track_name }} - {{ track_data.artist }}</title>
  <link rel="stylesheet" type="text/css" href="/static/waveform_style.css" />
</head>

<button id="backBtn" type="button" aria-label="Back">Back</button>

<header>

  <div class="album-cover-wrap">
    <img src="{{ track_data.thumbnail }}" alt="Album cover" width="120" />
  </div>
  <h1>{{ track_data.track_name }}</h1>
  <p>{{ track_data.artist }} · {{ track_data.track_album }}</p>
</header>

<body>
  <div id="loading" class="loading">Loading audio...</div>
  <div id="waveform"></div>

  <button id="playBtn" type="button" aria-label="Play/Pause">
    <img
      id="playIcon"
      src="{{ url_for('static', filename='icons/play-button.svg') }}"
      alt="Play"
    />
  </button>

  <form class="form" method="POST" id="regions-form">
    <table id="regions-table" hidden>
      <thead>
        <tr>
          <th>Label</th>
          <th>Start</th>
          <th>End</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="regions-table-body"></tbody>
    </table>

    <p id="no-regions-msg">No loop regions yet created. Click and drag on the waveform to create one.</p>

    <button type="button" id="saveBtn" class="saveBtn">Save to DB</button>
  </form>
</body>

<script>
  const wsRegions = WaveSurfer.Regions.create();

  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');

  const loadingEl = document.getElementById('loading');

  const ICONS = {
    play: "{{ url_for('static', filename='icons/play-button.svg') }}",
    pause: "{{ url_for('static', filename='icons/pause.svg') }}"
  }

  // Creation of random color rgba
  const randomNumber = (min, max) => Math.floor(Math.random() * (max - min + 1) + min)
  const randomByte = () => randomNumber(0, 255)
  const randomCssRgba = () => `rgba(${[randomByte(), randomByte(), randomByte(), '0.2'].join(',')})`

  const wavesurfer = WaveSurfer.create({
    container: '#waveform',
    waveColor: '#a8a8a8',
    progressColor: '#4353ff',
    url: {{ url | tojson }},
  plugins: [
    wsRegions
  ]
  });

  wavesurfer.on('play', () => {
    playIcon.src = ICONS.pause;
    playIcon.alt = 'Pause';
  });

  wavesurfer.on('pause', () => {
    playIcon.src = ICONS.play;
    playIcon.alt = 'Play';
  });

  wavesurfer.on('loading', (percent) => {
    loadingEl.textContent = `Loading audio... ${percent}%`;
  });

  const savedRegions = {{ regions | tojson }};

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = {{ url_for('project.main') | tojson }};
  });

  document.getElementById('playBtn').addEventListener('click', () => {
    wavesurfer.playPause();
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const data = wsRegions.getRegions().map(r => ({
      label: r.content?.textContent || r.content || '',
      start: r.start,
      end: r.end,
      color: r.color
    }));

    const body = new FormData();
    body.append('regions', JSON.stringify(data));

    try {
      const res = await fetch(window.location.href, { method: 'POST', body });
      if (!res.ok) throw new Error(res.status);
      alert("Saved to db!")
    } catch (err) {
      alert('Save failed: ' + err.message);
    }
  });


  wavesurfer.on('play', () => {

  });

  //Enable click-and-drag creation of new reagions
wavesurfer.on('ready', () => {
  let activeRegion = null;
  let loadingSaved = true;   // suppress the prompt while loading saved regions
  loadingEl.style.display = 'none';

  wsRegions.enableDragSelection({});

  // Register listeners FIRST
  wsRegions.on('region-created', (region) => {
    if (loadingSaved) return;

    const label = prompt('Label this region', 'New region');
    if (label) {
      region.setContent(label);
      region.loop = true;
      region.setOptions({ color: randomCssRgba() });
    } else {
      region.remove();
      return;
    }
    refreshRegionsTable();
  });

  wsRegions.on('region-updated', refreshRegionsTable);
  wsRegions.on('region-removed', refreshRegionsTable);
  wsRegions.on('region-in', (region) => { activeRegion = region; });

  wsRegions.on('region-out', (region) => {
    if (activeRegion !== region) return;
    const atEnd = Math.abs(wavesurfer.getCurrentTime() - region.end) < 0.1;
    if (region.loop && atEnd) {
      region.play();
    } else {
      activeRegion = null;
    }
  });

  wsRegions.on('region-clicked', (region, e) => {
    e.stopPropagation();
    activeRegion = region;
    region.play();
  });

  wsRegions.on('interaction', (time) => {
    activeRegion = wsRegions.getRegions().find(r => time >= r.start && time <= r.end) ?? null;
  });

  // THEN load saved regions
  savedRegions.forEach((r) => {
    const region = wsRegions.addRegion({
      content: r.label,
      start: r.start,
      end: r.end,
      color: r.color,
      drag: true,
      resize: true,
    });
    region.loop = true;
  });
  loadingSaved = false;

  refreshRegionsTable();
});

  function refreshRegionsTable() {

    const tbody = document.getElementById('regions-table-body');
    const table = document.getElementById('regions-table');
    const emptyMsg = document.getElementById('no-regions-msg');
    tbody.innerHTML = '';

    const regions = wsRegions.getRegions();
    const hasRegions = regions.length > 0;

    emptyMsg.hidden = hasRegions;
    table.hidden = !hasRegions;

    regions.forEach((region) => {
      const row = document.createElement('tr');

      row.innerHTML = `
        <td>${region.content?.textContent || region.content || ''}</td>
        <td>${region.start.toFixed(1)}</td>
        <td>${region.end.toFixed(1)}</td>
        <td>
          <button data-action="play">▶</button>
          <button data-action="delete">✕</button>
        </td>
      `;

      row.querySelector('[data-action="play"]').addEventListener('click', () => {
        region.play();
      });

      row.querySelector('[data-action="delete"]').addEventListener('click', () => {
        region.remove();
      });

      tbody.appendChild(row);
    });
  }
</script>
